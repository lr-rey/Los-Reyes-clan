<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Apply — Los Reyes</title>

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #0a0a0a;
      color: #eaeaea;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .apply-card {
      width: 100%;
      max-width: 480px;
      background: #141414;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 28px;
      animation: fadeIn 0.6s ease;
    }

    .back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #9ca3af;
      text-decoration: none;
      font-size: 14px;
      margin-bottom: 20px;
      transition: 0.2s;
    }

    .back:hover {
      color: #4ade80;
    }

    h1 {
      font-size: 22px;
      margin: 0 0 6px;
    }

    .apply-meta {
      color: #9ca3af;
      font-size: 14px;
      margin-bottom: 22px;
      line-height: 1.5;
    }

    .apply-meta i {
      color: #4ade80;
      margin-right: 4px;
    }

    label {
      display: block;
      font-size: 13px;
      color: #9ca3af;
      margin: 14px 0 6px;
    }

    input,
    textarea {
      width: 100%;
      padding: 11px 13px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      background: rgba(255,255,255,0.04);
      color: #fff;
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: 0.2s;
    }

    input:focus,
    textarea:focus {
      border-color: #4ade80;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    button[type="submit"] {
      width: 100%;
      margin-top: 24px;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: #f45f02;
      color: #0a0a0a;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }

    button[type="submit"]:hover {
      background: #ff8a00;
      transform: translateY(-2px);
    }

    button[type="submit"]:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .notice {
      padding: 14px;
      border-radius: 10px;
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      color: #fca5a5;
      font-size: 14px;
      text-align: center;
      margin-top: 15px;
      line-height: 1.5;
    }

    .hidden {
      display: none !important;
    }

    /* HONEYPOT PROTECTION */

    .hp-field {
      position: absolute;
      left: -9999px;
      width: 1px;
      height: 1px;
      overflow: hidden;
    }

    /* SUCCESS SCREEN */

    .success-screen {
      display: none;
      text-align: center;
      padding: 35px 15px;
      animation: fadeIn 0.6s ease forwards;
    }

    .success-screen.show {
      display: block;
    }

    .success-icon {
      width: 85px;
      height: 85px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: rgba(74,222,128,0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #4ade80;
      font-size: 42px;
      animation: popIn 0.5s cubic-bezier(.17,.67,.3,1.5);
    }

    .success-screen h2 {
      color: #4ade80;
      font-size: 24px;
      margin-bottom: 10px;
    }

    .success-screen p {
      color: #9ca3af;
      font-size: 14px;
      line-height: 1.6;
    }

    .success-line {
      width: 0;
      height: 3px;
      background: #4ade80;
      margin: 22px auto 0;
      border-radius: 10px;
      animation: lineGrow 0.8s ease forwards 0.4s;
    }

    /* ERROR MESSAGE */

    .submit-error {
      display: none;
      color: #fca5a5;
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 10px;
      padding: 12px;
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
    }

    .submit-error.show {
      display: block;
      animation: fadeIn 0.3s ease;
    }

    /* ANIMATIONS */

    @keyframes popIn {
      from {
        transform: scale(0);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes lineGrow {
      to {
        width: 90px;
      }
    }

  </style>
</head>

<body>

  <div class="apply-card">

    <!-- BACK BUTTON -->

    <a class="back" href="index.html">
      <i class="fas fa-arrow-left"></i>
      Back to events
    </a>

    <!-- EVENT INFORMATION -->

    <h1 id="eventTitle">Loading...</h1>

    <div class="apply-meta" id="eventMeta"></div>

    <!-- CLOSED NOTICE -->

    <div id="closedNotice" class="notice hidden">
      <i class="fas fa-lock"></i>
      Registration for this event is closed.
    </div>

    <!-- EVENT ERROR -->

    <div id="errorNotice" class="notice hidden">
      Event not found. Please go back and select an event.
    </div>

    <!-- APPLICATION FORM -->

    <form
      id="applyForm"
      action="https://formspree.io/f/xoeebnog"
      method="POST"
    >

      <!-- EVENT INFORMATION -->

      <input type="hidden" name="Event" id="eventField">

      <!-- PLAYER INFORMATION -->

      <label for="ign">In-game name</label>

      <input
        type="text"
        id="ign"
        name="In Game name"
        placeholder="e.g. LR REY"
        maxlength="30"
        required
      >

      <label for="uid">Free Fire UID</label>

      <input
        type="text"
        id="uid"
        name="FREE FIRE UID"
        placeholder="Your numeric UID"
        inputmode="numeric"
        pattern="[0-9]{9,12}"
        minlength="9"
        maxlength="12"
        title="Enter a 9–12 digit Free Fire UID"
        required
      >

      <!-- HONEYPOT PROTECTION -->

      <div class="hp-field" aria-hidden="true">

        <label for="honeypot">
          Leave this field empty
        </label>

        <input
          type="text"
          id="honeypot"
          name="_gotcha"
          tabindex="-1"
          autocomplete="off"
        >

      </div>

      <!-- SUBMIT BUTTON -->

      <button type="submit" id="submitBtn">

        <i class="fas fa-paper-plane"></i>
        Submit application

      </button>

    </form>

    <!-- SUCCESS ANIMATION -->

    <div id="successScreen" class="success-screen">

      <div class="success-icon">
        <i class="fas fa-check"></i>
      </div>

      <h2>Application Submitted!</h2>

      <p>
        Your application has been successfully received.
        <br>
        The Los Reyes team will review your registration.
      </p>

      <div class="success-line"></div>

      <p style="margin-top:22px;">
        Thank you for participating! 🔥
      </p>

    </div>

    <!-- ERROR MESSAGE -->

    <div id="submitError" class="submit-error"></div>

  </div>


  <script>

    // ==================================
    // EVENT INFORMATION
    // ==================================

    const EVENTS = {

      "squad-clash": {
        title: "🔥 Squad Clash",
        meta: "Nov 15, 20:00 · 4v4 custom room · Prize: 500 diamonds",
        closed: true
      },

      "guild-tournament": {
        title: "🏆 Guild Tournament",
        meta: "Nov 14, 18:30 · Bermuda · Entry fee: Free",
        closed: false
      },

      "aim-training": {
        title: "🎯 Aim Training",
        meta: "Nov 20, 21:00 · 1v1 sniper battles · Free entry",
        closed: false
      },

      "guild-meeting": {
        title: "🎉 Guild Meeting",
        meta: "Nov 22, 19:00 · Discord voice · Mandatory",
        closed: false
      },

      "diamond-rush": {
        title: "💎 Diamond Rush",
        meta: "Nov 25, 17:00 · Top fragger wins 200 diamonds",
        closed: false
      }

    };


    // ==================================
    // GET EVENT FROM URL
    // ==================================

    const params = new URLSearchParams(window.location.search);

    const slug = params.get("event");

    let ev = EVENTS[slug];


    // LOCALHOST FALLBACK

    if (
      !ev &&
      (
        location.hostname === "127.0.0.1" ||
        location.hostname === "localhost"
      )
    ) {

      ev = EVENTS["guild-tournament"];

    }


    // ==================================
    // HTML ELEMENTS
    // ==================================

    const titleEl = document.getElementById("eventTitle");

    const metaEl = document.getElementById("eventMeta");

    const formEl = document.getElementById("applyForm");

    const closedEl = document.getElementById("closedNotice");

    const errorEl = document.getElementById("errorNotice");

    const eventField = document.getElementById("eventField");

    const submitBtn = document.getElementById("submitBtn");

    const successScreen = document.getElementById("successScreen");

    const submitError = document.getElementById("submitError");


    // ==================================
    // CHECK EVENT
    // ==================================

    if (!ev) {

      titleEl.textContent = "Event not found";

      metaEl.textContent =
        "Please select an event from the events page.";

      errorEl.classList.remove("hidden");

      formEl.classList.add("hidden");

    } else {

      titleEl.textContent = ev.title;

      metaEl.textContent = ev.meta;

      eventField.value = ev.title;

      if (ev.closed) {

        closedEl.classList.remove("hidden");

        formEl.classList.add("hidden");

      }

    }


    // ==================================
    // FORM SUBMISSION WITH ANIMATION
    // ==================================

    formEl.addEventListener("submit", async function(e) {

      // Prevent page redirect

      e.preventDefault();


      // Validate form

      if (!formEl.reportValidity()) {
        return;
      }


      // Get player information

      const ign = document.getElementById("ign").value.trim();

      const uid = document.getElementById("uid").value.trim();


      // Check player information

      if (!ign || !/^\d{9,12}$/.test(uid)) {

        submitError.textContent =
          "Please enter a valid In-game name and Free Fire UID (9–12 digits).";

        submitError.classList.add("show");

        return;

      }


      // Loading animation

      submitBtn.disabled = true;

      submitBtn.innerHTML =
        '<i class="fas fa-spinner fa-spin"></i> Sending application...';

      submitError.classList.remove("show");


      try {

        // Send data to Formspree without leaving the page

        const response = await fetch(formEl.action, {

          method: "POST",

          body: new FormData(formEl),

          headers: {
            "Accept": "application/json"
          }

        });


        // Check server response

        if (response.ok) {

          // Hide the form

          formEl.classList.add("hidden");


          // Show success animation

          successScreen.classList.add("show");


        } else {

          // Handle Formspree errors

          let errorMessage =
            "Something went wrong. Please try again.";

          try {

            const result = await response.json();

            if (result.errors && result.errors.length) {

              errorMessage = result.errors
                .map(error => error.message)
                .join(" ");

            }

          } catch (parseError) {

            // Keep default error message

          }

          throw new Error(errorMessage);

        }


      } catch (error) {

        // Show error message

        submitError.textContent =
          error.message === "Failed to fetch"
            ? "Network error. Please check your internet connection and try again."
            : error.message;

        submitError.classList.add("show");


        // Restore submit button

        submitBtn.disabled = false;

        submitBtn.innerHTML =
          '<i class="fas fa-paper-plane"></i> Submit application';

      }

    });

  </script>

</body>
</html>
